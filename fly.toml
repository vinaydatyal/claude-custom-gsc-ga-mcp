# fly launch --no-deploy  then  fly deploy
app = "gsc-mcp"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  STATE_DIR = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

# Optional: keeps rotated-token state across restarts.
# fly volumes create gsc_data --size 1
[[mounts]]
  source = "gsc_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
